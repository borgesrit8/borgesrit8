<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230" role="img" aria-label="Naval Clash: jogo de Batalha Naval para Android, disponível na Google Play">
  <style>
    .t { font: 600 20px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ff7ab8; }
    .d { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffe6f1; }
    .b { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ffffff; }
    .s { font: italic 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #ff7ab8; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="229" rx="4.5" fill="#2e1020" stroke="#ff2e93"/>

  <!-- ícone âncora -->
  <g transform="translate(25,25)" fill="none" stroke="#ff2e93" stroke-width="1.8" stroke-linecap="round">
    <circle cx="11" cy="4" r="3"/>
    <line x1="11" y1="7" x2="11" y2="22"/>
    <line x1="5" y1="11" x2="17" y2="11"/>
    <path d="M2 15 C 3 20, 7 22, 11 22 C 15 22, 19 20, 20 15"/>
  </g>
  <text x="56" y="44" class="t">Naval Clash</text>

  <text x="25" y="82" class="d">Jogo de Batalha Naval para Android, com modo</text>
  <text x="25" y="103" class="d">contra o computador, multijogador online, loja</text>
  <text x="25" y="124" class="d">de temas e sistema de progressão.</text>

  <rect x="25" y="146" width="60" height="22" rx="3" fill="#ff2e93"/>
  <text x="55" y="161.5" class="b" text-anchor="middle">React</text>
  <rect x="93" y="146" width="78" height="22" rx="3" fill="#ff2e93"/>
  <text x="132" y="161.5" class="b" text-anchor="middle">Capacitor</text>
  <rect x="179" y="146" width="72" height="22" rx="3" fill="#ff2e93"/>
  <text x="215" y="161.5" class="b" text-anchor="middle">Firebase</text>

  <rect x="25" y="188" width="196" height="24" rx="12" fill="#ff2e93"/>
  <path d="M38 193.5 L38 206.5 L49 200 Z" fill="#ffffff"/>
  <text x="56" y="204.5" class="b">Disponível na Google Play</text>
</svg>
